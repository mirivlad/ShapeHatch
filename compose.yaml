services:
  api:
    build: ./backend
    restart: unless-stopped
    read_only: true
    environment:
      SHAPEHATCH_GALLERY_DB: /data/gallery.sqlite3
    volumes:
      - gallery-data:/data
    tmpfs:
      - /tmp:size=128m
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: "2.0"
    networks:
      - shapehatch
  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8086:80"
    networks:
      - shapehatch
networks:
  shapehatch:
    driver: bridge

volumes:
  gallery-data: